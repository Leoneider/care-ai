<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Bandeja Care{% endblock %}</title>
<style>
:root{
  --fondo:#ffffff; --panel:#f7f8fa; --borde:#dfe3e8; --texto:#12161c;
  --tenue:#5c6773; --acento:#1d4ed8; --acento-suave:#eef2ff;
  --ok:#0f7b46; --alerta:#9a5b00; --falla:#b4231d;
  --ok-bg:#e8f5ee; --alerta-bg:#fdf3e0; --falla-bg:#fdecea;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fondo:#0f1319; --panel:#161b23; --borde:#2a323d; --texto:#e6eaf0;
    --tenue:#98a3b2; --acento:#7aa2ff; --acento-suave:#1a2338;
    --ok:#5bd99a; --alerta:#e8b25a; --falla:#ff8b82;
    --ok-bg:#12281d; --alerta-bg:#2a2112; --falla-bg:#2c1614;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--fondo); color:var(--texto);
  font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
.envoltura{max-width:980px; margin:0 auto; padding:0 16px 72px}
header.barra{
  border-bottom:1px solid var(--borde); background:var(--panel);
  position:sticky; top:0; z-index:5;
}
header.barra .envoltura{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding-top:14px; padding-bottom:14px;
}
.marca{font-weight:650; letter-spacing:-.01em; margin-right:auto}
.marca a{color:inherit; text-decoration:none}
.marca small{display:block; font-weight:400; color:var(--tenue); font-size:12px}
nav a{
  color:var(--tenue); text-decoration:none; font-size:14px;
  padding:5px 10px; border-radius:6px;
}
nav a.activo{background:var(--acento-suave); color:var(--acento); font-weight:550}

h1{font-size:21px; margin:26px 0 4px; letter-spacing:-.01em}
h2{font-size:15px; margin:0; letter-spacing:-.005em}
.sub{color:var(--tenue); font-size:13px; margin:0 0 20px}
.mono{font-family:var(--mono); font-size:12.5px}

table{width:100%; border-collapse:collapse; margin-top:10px}
th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--tenue); font-weight:600; padding:0 10px 8px; border-bottom:1px solid var(--borde);
}
td{padding:11px 10px; border-bottom:1px solid var(--borde); vertical-align:top}
tbody tr:hover{background:var(--panel)}
td a.caso{color:var(--texto); text-decoration:none; font-weight:550}
td a.caso:hover{color:var(--acento)}
.num{font-family:var(--mono); font-size:12.5px; text-align:right; white-space:nowrap}

.pill{
  display:inline-block; padding:1px 7px; border-radius:999px;
  font-size:11px; font-weight:600; font-family:var(--mono); white-space:nowrap;
}
.p1{background:var(--falla-bg); color:var(--falla)}
.p2{background:var(--alerta-bg); color:var(--alerta)}
.p3,.p4,.p5{background:var(--panel); color:var(--tenue); border:1px solid var(--borde)}
.ok{background:var(--ok-bg); color:var(--ok)}
.alerta{background:var(--alerta-bg); color:var(--alerta)}
.falla{background:var(--falla-bg); color:var(--falla)}
.neutro{background:var(--panel); color:var(--tenue); border:1px solid var(--borde)}

.tarjeta{
  border:1px solid var(--borde); border-radius:10px; background:var(--panel);
  padding:16px 18px; margin:14px 0;
}
.tarjeta.atencion{border-left:3px solid var(--alerta)}
.encabezado-tarjeta{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:10px}
.cita{
  border-left:2px solid var(--acento); background:var(--fondo);
  padding:7px 12px; margin:10px 0; color:var(--tenue);
  font-family:var(--mono); font-size:12.5px; border-radius:0 6px 6px 0;
}
.campos{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0}
.chip{
  font-family:var(--mono); font-size:11.5px; padding:2px 8px;
  border:1px solid var(--borde); border-radius:6px; background:var(--fondo);
}
.chip b{font-weight:600; color:var(--tenue)}
.etiqueta{
  font-size:11px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--tenue); font-weight:600; margin:14px 0 6px;
}
ul.checks{list-style:none; padding:0; margin:0; display:grid; gap:5px}
ul.checks li{display:flex; gap:8px; align-items:flex-start; font-size:13.5px}
ul.checks li span.pill{flex:none; margin-top:1px}
.bloqueante{font-weight:600}

.accion{
  display:grid; grid-template-columns:auto 1fr; gap:10px;
  padding:11px 0; border-top:1px dashed var(--borde);
}
.accion:first-of-type{border-top:0}
.accion input[type=checkbox]{margin-top:4px; width:16px; height:16px; accent-color:var(--acento)}
.accion .codigo{font-family:var(--mono); font-size:13px; font-weight:600}
.accion .sistema{font-size:11px; color:var(--tenue); font-family:var(--mono)}
.params{display:flex; flex-wrap:wrap; gap:8px; margin-top:7px}
.params label{font-size:11.5px; color:var(--tenue); display:grid; gap:2px}
input[type=text], textarea{
  font:inherit; font-size:13px; padding:5px 8px; color:var(--texto);
  background:var(--fondo); border:1px solid var(--borde); border-radius:6px;
  width:100%; font-family:inherit;
}
.params input[type=text]{font-family:var(--mono); font-size:12px; min-width:150px}
textarea{min-height:64px; resize:vertical}
input:focus, textarea:focus{outline:2px solid var(--acento); outline-offset:-1px; border-color:transparent}

.acciones-pie{
  display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  margin-top:18px; padding-top:16px; border-top:1px solid var(--borde);
}
button{
  font:inherit; font-size:14px; font-weight:550; padding:8px 16px;
  border-radius:7px; border:1px solid var(--borde); background:var(--fondo);
  color:var(--texto); cursor:pointer;
}
button:hover{border-color:var(--acento); color:var(--acento)}
button.primario{background:var(--acento); border-color:var(--acento); color:#fff}
button.primario:hover{opacity:.88; color:#fff}
button.peligro:hover{border-color:var(--falla); color:var(--falla)}
.nota-pie{font-size:12px; color:var(--tenue); margin-left:auto; max-width:330px; text-align:right}

details{margin:14px 0}
summary{cursor:pointer; font-size:13px; color:var(--tenue); padding:4px 0}
summary:hover{color:var(--acento)}
pre.cuerpo{
  white-space:pre-wrap; word-break:break-word; font-family:var(--mono);
  font-size:12.5px; background:var(--panel); border:1px solid var(--borde);
  border-radius:8px; padding:12px; margin:8px 0 0; color:var(--tenue);
}
.vacio{
  text-align:center; padding:56px 20px; color:var(--tenue);
  border:1px dashed var(--borde); border-radius:10px; margin-top:20px;
}
.vacio code{font-family:var(--mono); font-size:12.5px; background:var(--panel); padding:2px 6px; border-radius:4px}
.aviso{
  border:1px solid var(--borde); border-left:3px solid var(--acento);
  background:var(--panel); border-radius:0 8px 8px 0; padding:11px 14px;
  font-size:13.5px; margin:14px 0;
}
.aviso.alto{border-left-color:var(--falla); background:var(--falla-bg); color:var(--falla)}

.bloqueo{
  border:1px solid var(--falla); background:var(--falla-bg);
  border-radius:10px; padding:14px 16px; margin:18px 0 6px;
}
.bloqueo-titulo{font-weight:650; color:var(--falla); font-size:14px}
.bloqueo ul{margin:8px 0 12px; padding-left:20px; font-size:13.5px; color:var(--texto)}
.bloqueo li{margin:3px 0}
.confirmar{
  display:flex; gap:9px; align-items:flex-start; font-size:13.5px;
  padding-top:11px; border-top:1px solid var(--falla); cursor:pointer;
}
.confirmar input{margin-top:2px; width:16px; height:16px; flex:none; accent-color:var(--falla)}
.volver{font-size:13px; color:var(--tenue); text-decoration:none; display:inline-block; margin-top:22px}
.volver:hover{color:var(--acento)}
/* --- Fase 2: ejecucion, verificacion y sistemas --- */
.ejecucion{border:1px solid var(--borde); border-radius:10px; padding:16px 18px; margin:16px 0; background:var(--fondo)}
.ejecucion.riesgo{border-color:var(--alerta); border-left:3px solid var(--alerta)}
.ejecucion.cerrado{border-left:3px solid var(--ok)}
.ejecucion h2{margin-bottom:4px}
ul.motivos{margin:8px 0 4px; padding-left:20px; font-size:13.5px}
ul.motivos li{margin:3px 0}
table.compacta td, table.compacta th{padding:7px 8px; font-size:13px}
table.compacta td.det{color:var(--tenue)}
.cuentas{display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 18px}
.cuentas a{
  text-decoration:none; color:var(--texto); border:1px solid var(--borde); border-radius:8px;
  padding:7px 12px; font-size:13.5px; background:var(--panel);
}
.cuentas a.activo{border-color:var(--acento); color:var(--acento); background:var(--acento-suave); font-weight:550}
.cuentas a small{display:block; font-family:var(--mono); font-size:11px; color:var(--tenue)}
.rejilla{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px}
.rejilla .tarjeta{margin:0}
dl.datos{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:0; font-size:13.5px}
dl.datos dt{color:var(--tenue)}
dl.datos dd{margin:0; font-family:var(--mono); font-size:12.5px}
.tabla-scroll{overflow-x:auto}
.tabla-scroll table{min-width:560px}
tr.tocado td:first-child{box-shadow:inset 3px 0 0 var(--acento)}
.cambio{font-family:var(--mono); font-size:12px; white-space:nowrap}
.cambio s{color:var(--tenue)}
.seccion{margin-top:26px}
.restaurar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--tenue);
  margin-top:28px; padding-top:16px; border-top:1px solid var(--borde)}
.restaurar label{display:flex; gap:6px; align-items:center}
@media (max-width:640px){
  .num{text-align:left}
  th.ocultar, td.ocultar{display:none}
  .nota-pie{margin-left:0; text-align:left; max-width:none}
}
</style>
</head>
<body>
<header class="barra">
  <div class="envoltura">
    <div class="marca">
      <a href="/">Care AI</a>
      <small>bandeja del ejecutivo &middot; fase 2</small>
    </div>
    <nav>
      <a href="/" class="{{ 'activo' if vista == 'pendientes' }}">Pendientes {{ conteo.pendientes }}</a>
      <a href="/verificacion" class="{{ 'activo' if vista == 'verificacion' }}">En verificacion {{ conteo.en_verificacion }}</a>
      <a href="/resueltos" class="{{ 'activo' if vista == 'resueltos' }}">Resueltos {{ conteo.resueltos }}</a>
      <a href="/sistemas" class="{{ 'activo' if vista == 'sistemas' }}">Sistemas</a>
    </nav>
  </div>
</header>
<main class="envoltura">
{% block contenido %}{% endblock %}
</main>
</body>
</html>
